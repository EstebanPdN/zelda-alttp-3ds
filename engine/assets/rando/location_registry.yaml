# location_registry.yaml — Phase A location ID registry
#
# Per `randomizer-logic / Location and region model with stable IDs` and
# tasks.md §3.1. Source-of-truth for `#define LOC_<Name> <numeric_id>` in
# the generated `src/rando/location_ids.h`.
#
# Discipline:
# - IDs are append-only. Removed locations keep their slot with `deprecated: true`.
# - Renaming a location does not change its numeric ID.
# - The ID is the source of truth for placements, spoilers, and embedded
#   save tables — embedded placement tables in saves reference these IDs.
# - Changing any ID is a `kGeneratorVersion` bump trigger (tasks.md §13.6).
# - Each entry cites its ALTTPR PHP source per audit §0.10.1 attribution
#   discipline.
#
# Enumeration follows audit §0.3.5 catalog (216 entries total).
#
# Notes on world_state_filter:
# - Omit field for locations present in all four world-states (the common case).
# - Inverted-only locations: `world_state_filter: [inverted]`.
# - Conditional locations (Pyramid Fairy Left/Right, etc.): documented in
#   notes; Phase A treats as always-present per audit §0.3.5.

