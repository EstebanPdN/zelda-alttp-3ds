  # ===========================================================================
  # Phase B Slice 3b — Retro TakeAny cave locations (IDs 266..327)
  #
  # Per `openspec/changes/add-rando-retro-takeany/design.md`. ALTTPR declares
  # 31 `Shop\TakeAny` (app/Region/Standard/**; Inverted declares 0). Each cave
  # has TWO inventory slots (slot 0, slot 1) — modelled as two LOC ids per cave
  # so the runtime `(room, door, pos)->loc_base+pos` dispatch works exactly like
  # the 3a regular shops. Cave index = (id - 266) / 2; slot = (id - 266) % 2.
  #
  # PER-SEED ACTIVE SUBSET (Option B, design §D4): of the 31 caves, the placer
  # selects 5 active per seed (Randomizer.php:716-735): 4 "potion" caves give
  # BluePotion@slot0 + BossHeartContainer@slot1, and 1 "weapon" cave gives
  # ProgressiveSword (or Rupee300 when mode.weapons in {swordless,vanilla})
  # @slot0 only. So exactly 9 LOC ids emit per seed (4*2 + 1); the other 53 are
  # NOT in the placement table. Selection is deterministic (Rando_TakeAnySelect,
  # rng = seed ^ salt) — see src/rando/rando_placement.c.
  #
  # `vanilla_item` here is a NOMINAL fallback only: the placer assigns the real
  # reward per role (BluePotion/BossHeart/sword/rupee) and pins it. Inactive
  # caves never emit, active caves are always pinned, and these are retro-only,
  # so the fallback is never reached at runtime.
  #
  # `region:` is descriptive only (codegen takes region binding from logic.yaml;
  # TakeAny is REGION_OPTIONAL like Shop — gated by world_state_filter + the
  # per-seed active gate, not by a region predicate).
  #
  # `door_id` (ALTTPR 5th ctor arg) is recorded in NOTES per cave; the runtime
  # keys redirect/dispatch on it (door_id = overworld row-index lx + 1). The
  # ROM-patch dest byte 0x58/0x60/0x46 -> host room 0x112/0x10F/0x11F.
  # ===========================================================================

