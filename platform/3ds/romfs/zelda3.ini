[General]
Autosave = 1
DisplayPerfInTitle = 0
ExtendedAspectRatio = 4:3
DisplayMode = Wide
WideEdgeMode = FixedCamera
DisableFrameDelay = 1
CStickTurboMultiplier = 5
ShowFps = 0
SecondScreenXItemRing = 1
SecondScreenCrt = 0

[Graphics]
WindowSize = 400x240
Fullscreen = 1
WindowScale = 1
NewRenderer = 1
EnhancedMode7 = 0
IgnoreAspectRatio = 0
NoSpriteLimits = 1
OutputMethod = SDL-Software
LinearFiltering = 0
CrtFilter = 0
DimFlashes = 0

[Sound]
EnableAudio = 1
# Output sample rate in Hz. Ignored on 3DS: Platform3DS_ApplyConfig() sets it at
# startup -- 44100 when MSU is active or on New 3DS, 32000 otherwise -- because
# MSU PCM is 44100 and the mixer does not resample.
# Kept here so the file still reads as a normal zelda3.ini.
AudioFreq = 32000
# 2 = stereo. Also applied by Platform3DS_ApplyConfig(). MSU mixing is skipped
# when the device ends up mono, because its PCM is interleaved stereo.
AudioChannels = 2
AudioSamples = 1024

# MSU-1 audio. Tracks live in MSUPath and are named 1.pcm .. 48.pcm (0.pcm is an
# optional menu track). Startup probes four fixed paths -- msu/1.pcm, msu/0.pcm,
# msu1.pcm and 1.pcm -- and finding one turns plain PCM MSU on by itself, so
# placing the files is normally all that is needed.
#   true | 1        plain MSU-1 PCM
#   deluxe          MSU Deluxe variant (adds alternate overworld/dungeon tracks)
#   opuz            Opus variant, needs AudioFreq 48000 (dropped on 3DS: this
#                   port plays MSU at 44100 Hz only)
#   deluxe-opuz     both
# An explicit value here is preserved; detection only fills in a disabled one.
# The probe list is fixed, so a custom MSUPath needs EnableMSU = true to load.
EnableMSU = false
# Track path prefix, relative to the working directory (sdmc:/3ds/Zelda 3DS/).
# This is a PREFIX, not a folder: the loader appends "<track>.pcm" with no
# separator of its own, so the default reads msu/alttp_msu-1.pcm -- the naming
# stock MSU packs ship with. Use "msu/" if your tracks are plain numbers
# (msu/1.pcm), or leave it empty to read 1.pcm beside zelda3.ini.
MSUPath = msu/alttp_msu-
# Resume a track at its saved position after leaving and returning to the
# overworld instead of restarting it. 0 restarts, 1 resumes.
ResumeMSU = 0
# MSU mixing level, 0% to 100%. Percent signs are accepted.
MSUVolume = 100%

[Features]
ItemSwitchLR = 1
ItemSwitchLRLimit = 0
TurnWhileDashing = 0
MirrorToDarkworld = 0
CollectItemsWithSword = 0
BreakPotsWithSword = 0
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 0
ShowMaxItemsInYellow = 0
MoreActiveBombs = 0
CarryMoreRupees = 0
MiscBugFixes = 0
GameChangingBugFixes = 0
CancelBirdTravel = 0

[GamepadMap]
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, A, B, X, Y, L1, R1
Turbo = L2
