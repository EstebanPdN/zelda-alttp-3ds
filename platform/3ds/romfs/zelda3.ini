[General]
Autosave = 1
DisplayPerfInTitle = 0
ExtendedAspectRatio = 4:3
DisplayMode = Wide
WideEdgeMode = FixedCamera
DisableFrameDelay = 1
CStickTurboMultiplier = 5
ShowFps = 0
# Stereoscopic 3D (3D slider): Off, Low, Medium, High
Stereo3D = Medium
# Character body lean: how far upper bodies pop out (feet stay on the ground).
# Percent of the old flat sprite pop; 0 = flat, 200 = default, max 600.
Stereo3DBody = 200
# Wide mode HUD: Anchor (left half at the left edge, hearts at the right edge) or Center
WideHud = Anchor
# Trees, roofs and bushes lean out with their base on the ground (percent, 0 = off)
Stereo3DScenery = 100
# How far the HUD and dialog boxes float in front of the scene (percent, 0 = off)
Stereo3DHud = 100
# Bush lean, percent of the scenery lean (0 = flat bushes)
Stereo3DBush = 30
# How far water sits behind the ground (percent, 0 = off)
Stereo3DWater = 100
# World map and bird flight (Mode 7): tilt of the map plane, percent (0 = flat)
Stereo3DMap = 100
SecondScreenXItemRing = 1
SecondScreenCrt = 0

[Graphics]
WindowSize = 400x240
Fullscreen = 1
WindowScale = 1
NewRenderer = 1
EnhancedMode7 = 0
IgnoreAspectRatio = 0
NoSpriteLimits = 1
OutputMethod = SDL-Software
LinearFiltering = 0
CrtFilter = 0
DimFlashes = 0

[Sound]
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 1024
EnableMSU = false
ResumeMSU = 0
MSUVolume = 100%

[Features]
ItemSwitchLR = 1
ItemSwitchLRLimit = 0
TurnWhileDashing = 0
MirrorToDarkworld = 0
CollectItemsWithSword = 0
BreakPotsWithSword = 0
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 0
ShowMaxItemsInYellow = 0
MoreActiveBombs = 0
CarryMoreRupees = 0
MiscBugFixes = 0
GameChangingBugFixes = 0
CancelBirdTravel = 0

[GamepadMap]
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, A, B, X, Y, L1, R1
Turbo = L2
